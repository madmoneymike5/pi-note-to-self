name: Review Stack
# review-stack-control: runtime mirror rollout verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-stack:
    uses: >-
      madmoneymike5/review-stack-runtime/.github/workflows/review-stack.yml@e32b9fa29dbcf65a289c3fd066d42cd7cb2f094f
    with:
      native-command: >-
        tmp="$(mktemp -d)" &&
        trap 'rm -rf "$tmp"' EXIT &&
        node_archive="$tmp/node-v22.23.2-linux-x64.tar.xz" &&
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2
        --output "$node_archive"
        https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz &&
        printf '%s  %s\n'
        d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
        "$node_archive" |
        sha256sum --check --status &&
        tar -xJf "$node_archive" -C "$tmp" --strip-components=1 &&
        export PATH="$tmp/bin:$PATH" &&
        test "$(node --version)" = "v22.23.2" &&
        npm ci --ignore-scripts && npm run check
      opengrep-excludes: ""
      gitleaks-excludes: |-
